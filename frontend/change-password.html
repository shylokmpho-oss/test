<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hospital Booking System - Choose Your Password</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-header">
      <div class="brand">
        <div class="badge">H</div>
        <div class="name">Hospital Booking System</div>
      </div>
      <div class="sub" id="subtitle">Choose your own password</div>
    </div>
    <div class="auth-body">

      <div id="banner" class="banner"></div>
      <p class="muted" id="intro" style="margin-bottom:16px;"></p>

      <form id="changeForm" novalidate>
        <p class="required-note">Required fields</p>
        <div class="field">
          <label for="current_password" id="currentLabel">Temporary password</label>
          <input type="password" id="current_password" autocomplete="current-password" required>
          <div class="error">Please enter your current password.</div>
        </div>
        <div class="row-2">
          <div class="field">
            <label for="new_password">New Password</label>
            <input type="password" id="new_password" autocomplete="new-password" required>
            <div class="error">At least 8 characters, different from the current one.</div>
          </div>
          <div class="field">
            <label for="confirm_password">Confirm Password</label>
            <input type="password" id="confirm_password" autocomplete="new-password" required>
            <div class="error">Passwords do not match.</div>
          </div>
        </div>
        <button type="submit" class="btn btn-primary" id="saveBtn">Save Password</button>
      </form>

      <div class="divider">Not you?</div>
      <button type="button" class="btn btn-secondary" id="logoutBtn">Log Out</button>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/change-password.js"></script>
</body>
</html>
